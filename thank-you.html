<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Anvith's Avengers</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#e8b923;--dark:#080c14;--card-bg:#0d1421;--text:#e8e8e8;--muted:#8899aa}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh}

nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(8,12,20,0.97);backdrop-filter:blur(10px);border-bottom:1px solid rgba(232,185,35,0.2);padding:0 2rem}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);letter-spacing:3px;text-decoration:none}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;transition:color 0.2s}
.nav-links a:hover{color:var(--gold)}

.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8rem 2rem 5rem;text-align:center}
.card{max-width:560px;background:var(--card-bg);border:1px solid rgba(255,255,255,0.07);padding:3rem 2.5rem;opacity:0;animation:fadeUp 0.6s 0.1s forwards}
.success-icon{font-size:72px;margin-bottom:1.25rem;animation:pop 0.5s 0.2s ease forwards;opacity:0}
.success-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,56px);letter-spacing:3px;color:var(--gold);margin-bottom:0.75rem}
.success-sub{color:var(--muted);font-size:16px;line-height:1.8;margin-bottom:0.5rem}
.success-name{color:var(--text);font-weight:700}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.btn{padding:13px 32px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;text-decoration:none;transition:all 0.2s;display:inline-block}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:#f5cd3a;transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-outline:hover{background:rgba(232,185,35,0.1);transform:translateY(-2px)}

footer{text-align:center;padding:2rem;border-top:1px solid rgba(232,185,35,0.15);background:#050810}
.footer-text{font-size:12px;color:var(--muted);letter-spacing:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(0.5)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">⚡ Anvith's Avengers</a>
    <div class="nav-links">
      <a href="heroes.html">Heroes</a>
      <a href="about.html">About</a>
      <a href="merch.html">Merch</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">🛒 Cart</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="card">
    <div class="success-icon">✅</div>
    <div class="success-title">Message Sent!</div>
    <div class="success-sub" id="thankYouMsg">Thanks for reaching out, hero. We'll get back to you within 24 hours.</div>
    <div class="btn-row">
      <a href="index.html" class="btn btn-gold">← Back to Home</a>
      <a href="merch.html" class="btn btn-outline">Shop Merch</a>
    </div>
  </div>
</div>

<footer><div class="footer-text">© 2026 Anvith's Avengers · Earth's Mightiest Heroes</div></footer>

<script>
// Personalize the message if a name was passed via query string, e.g. thank-you.html?name=Steve
const params = new URLSearchParams(window.location.search);
const name = params.get('name');
if (name) {
  document.getElementById('thankYouMsg').innerHTML =
    `Thanks for reaching out, <span class="success-name">${name.replace(/</g,'')}</span>.<br>We'll get back to you within 24 hours.`;
}
</script>
</body>
</html>
